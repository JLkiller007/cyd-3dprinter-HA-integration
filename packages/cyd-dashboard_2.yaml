display:
  - platform: mipi_spi
    id: tft
    spi_id: lcd
    model: ST7789V
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO0
    invert_colors: false
    color_order: bgr
    byte_order: big_endian
    data_rate: 20MHz
    auto_clear_enabled: false
    color_depth: 16
    dimensions:
      width: 240
      height: 320
      offset_x: 0
      offset_y: 0
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    update_interval: never
